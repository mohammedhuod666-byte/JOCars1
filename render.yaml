services:
  - type: web
    name: jo-cars-marketplace
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_VIDEO_PRESET
        value: jo_cars_video_unsigned
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: noreply@jocars.com
      - key: BACKUP_CRON_SECRET
        sync: false
      - key: BACKUP_EMAIL_TO
        value: mohammedhuod666@gmail.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: JO Cars
      - key: NEXT_PUBLIC_APP_DESCRIPTION
        value: "أفضل منصة أردنية لبيع وشراء السيارات"
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        value: info@jocars.com
      - key: NEXT_PUBLIC_CONTACT_PHONE
        value: "+962 6 500 0000"
      - key: CSRF_SECRET
        sync: false
      - key: SENTINEL_INTERNAL_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ULTRA_MSG_TOKEN
        sync: false
      - key: ULTRA_MSG_INSTANCE
        value: instance0
    healthCheckPath: /api/health
    autoDeploy: true