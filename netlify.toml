[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["**/*"]

[edge_functions]
  external_node_modules = ["@prisma/client", "@prisma/adapter-neon"]