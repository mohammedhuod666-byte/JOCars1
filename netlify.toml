[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "scratch/** scripts/** SETUP_COMPLETE.md render.yaml .netlify/**"
  SECRETS_SCAN_OMIT_KEYS = "OPENAI_API_BASE OPENAI_API_KEY OPENAI_MODEL SMTP_HOST SMTP_USER SMTP_PASS BACKUP_EMAIL_TO VAPID_SUBJECT NEXT_PUBLIC_CLOUDINARY_VIDEO_PRESET NEXT_PUBLIC_APP_URL SENTINEL_INTERNAL_SECRET ABLY_API_KEY VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY BACKUP_CRON_SECRET BACKUP_ENCRYPTION_KEY BACKUP_RETENTION_DAYS NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_SUBJECT NVIDIA_API_KEY OPENAI_API_BASE OPENAI_API_KEY OPENAI_MODEL SMTP_HOST SMTP_USER SMTP_PORT SMTP_PASS BACKUP_EMAIL_TO VAPID_SUBJECT"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["**/*"]