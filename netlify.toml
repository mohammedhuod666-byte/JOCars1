[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Exclude large directories that bloat the function bundle
  excluded_files = [
    "scratch/**",
    "scripts/**",
    "docs/**",
    "SETUP_COMPLETE.md",
    "render.yaml",
    ".netlify/**",
    ".open-next/**",
    ".wrangler/**",
    "*.md",
    "*.txt",
    "*.py",
    "*.ps1",
    "*.cjs",
    "*.log",
    "*.json",
    "!package.json",
    "!package-lock.json",
    "!next.config.js",
    "!tailwind.config.ts",
    "!tsconfig.json"
  ]